name: dramalive_replica
description: >
  Cliente réplica de la arquitectura de Drama Live (IPTV/Xtream/M3U/FG player).
  Independiente: sin SDKs publicitarios, sin telemetría de terceros, sin
  branding del producto original. Consume fuentes que aporta el usuario o el
  backend de referencia de este repo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # state + routing
  provider: ^6.1.2
  go_router: ^14.2.0

  # network
  http: ^1.2.2

  # playback — HLS/DASH. media_kit cubre Android/desktop/web; video_player es
  # el fallback ligero en Android/iOS/web.
  video_player: ^2.9.1
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  wakelock_plus: ^1.2.8

  # persistence
  shared_preferences: ^2.3.2

  # util
  intl: ^0.19.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/

# ---------------------------------------------------------------------------
# Lo que NO está aquí, a propósito (comparado con el APK original):
#
#   ✗ 15 SDKs publicitarios (AppLovin, ironSource, Unity, Vungle, Tapjoy,
#     StartApp, InMobi, Mintegral, Pangle, Maticoo, Bigo, Yandex, myTarget,
#     AppNext, Chartboost + TopOn)  → 30,5 MB del APK original
#   ✗ ACRA / crash reporting a un dominio de tercero
#   ✗ Firebase Analytics + Messaging + Installations
#   ✗ AppMetrica
#   ✗ Google Play Billing
#   ✗ Smack/XMPP (el chat se deja como módulo pendiente, ver docs/02)
#
# La app original pesa 30,5 MB con 7 pantallas. Esta réplica cubre las mismas
# 7 pantallas con ~10 dependencias.
# ---------------------------------------------------------------------------
